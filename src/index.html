<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FLUX v3</title>
<script>
  // Apply saved theme before first paint to avoid a flash. Defaults to light.
  try {
    var t = localStorage.getItem('flux_theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
